const CLONES = { clown: { at: 0, n: 8, dt: .07, spd: 640, sc: .88, flip: 1 }, runner: { at: 8, n: 8, dt: .055, spd: 860, sc: .82, flip: -1 }, punch: { at: 17, n: 7, dt: .07, spd: 920, sc: .82, flip: 1 }, spectre: { at: 26, n: 5, dt: .08, spd: 600, sc: .9, flip: 1 } };
const CARRY_HIT = { dmg: 3, kb: 0, stun: 9, nosp: 1 }, CARRY_END = { dmg: 10, kb: 260, launch: 470, heavy: 1, nosp: 1 }, CLONE_BOSS = { dmg: 7, kb: 60, stun: .3, nosp: 1 };
function spawnClones(p) {
  const dir = p.face, kinds = ['runner', 'clown', 'punch', 'spectre'];
  kinds.forEach((k, i) => G.clones.push({ clone: 1, kind: k, owner: p, dir, delay: i * .3, t: 0, x: dir > 0 ? G.cam - 140 : G.cam + W + 140,
    y: FLOOR_TOP + 24 + i * ((FLOOR_BOT - FLOOR_TOP - 30) / 3), carried: [], hitT: new Map(), released: false }));
  G.banner = { txt: 'ZIRUS DO MULTIVERSO!', sub: 'TODAS AS VERSÕES DO ZIRU', t: 1.8 };
}
function releaseCarried(c) {
  c.released = true;
  for (const e of c.carried) if (e.carrier === c) { e.carrier = null; e.state = 'chase'; e.z = Math.max(e.z, 2); damageEnemy(c.owner, e, CARRY_END, -c.dir); fxSpark(e.x, e.y - e.z - e.h * .5, true); }
  c.carried = [];
}
function updateClones(dt) {
  for (const c of G.clones) {
    if (c.delay > 0) { c.delay -= dt; if (c.delay <= 0) { Snd.jump(); fxDust(c.dir > 0 ? G.cam + 20 : G.cam + W - 20, c.y, 4); } continue; }
    const K = CLONES[c.kind]; c.t += dt; c.x += c.dir * K.spd * dt;
    if (Math.random() < dt * 20) fxDust(c.x - c.dir * 40, c.y, 1);
    const edge = c.dir > 0 ? c.x > G.cam + W - 80 : c.x < G.cam + 80;
    if (!c.released && edge) releaseCarried(c);
    if (c.released) continue;
    for (const e of G.enemies) {
      if (e.state === 'dead' || e.state === 'love' || e.hp <= 0 || e.carrier || Math.abs(e.y - c.y) > 50 || Math.abs(e.x - c.x) > 64) continue;
      if (e.T.boss) { const last = c.hitT.get(e) || -9; if (c.t - last > .2) { c.hitT.set(e, c.t); damageEnemy(c.owner, e, CLONE_BOSS, c.dir); } continue; }
      damageEnemy(c.owner, e, CARRY_HIT, c.dir); if (e.hp > 0) { e.carrier = c; c.carried.push(e); c.hitT.set(e, c.t); }
    }
    // socos enquanto carrega
    for (const e of c.carried) if (e.carrier === c && c.t - (c.hitT.get(e) || 0) > .16) { c.hitT.set(e, c.t); damageEnemy(c.owner, e, CARRY_HIT, c.dir); }
    c.carried = c.carried.filter(e => e.carrier === c);
  }
  G.clones = G.clones.filter(c => c.delay > 0 || (c.dir > 0 ? c.x < G.cam + W + 260 : c.x > G.cam - 260));
}
function drawClone(c) {
  if (c.delay > 0) return;
  const K = CLONES[c.kind], fr = K.at + Math.floor(c.t / K.dt) % K.n, sx = c.x - G.cam;
  shadow(sx, c.y, 40, c.kind === 'punch' ? 30 : 0);
  for (let k = 3; k >= 1; k--) drawSpr(IMG.tdah, ATLAS.tdah[K.at + Math.floor((c.t - k * .04) / K.dt + K.n * 9) % K.n], sx - c.dir * k * 26, c.y, K.sc, c.dir * K.flip, 0, 1, 1, .14 * (4 - k), '#3ef0e0', .6);
  drawSpr(IMG.tdah, ATLAS.tdah[fr], sx, c.y, K.sc, c.dir * K.flip, 0, 1, 1, 1, '#fff', 0);
}
